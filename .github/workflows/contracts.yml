name: security contest checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contest-core:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --no-cache-dir uv==0.11.7
      - run: uv sync --locked
      - run: uv run ruff check --select E9,F src tests
      - run: uv run python scripts/cleanup_sweep.py --json --fail-on-risky
      - run: uv run python -m compileall -q src tests
      - run: uv run python -m unittest discover -s tests/unit -v
      - run: uv build

  cage4-range:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
      - run: python -m pip install --no-cache-dir uv==0.11.7
      - run: scripts/bootstrap_cage4.sh
      - run: ORDIVON_CAGE4_SOURCE=.cache/cage4 uv run --extra cage python -m unittest discover -s tests -v
      - run: >-
          uv run --extra cage ordivon-security-cage4
          --source .cache/cage4
          --output .artifacts/ci-cage4
          --steps 2
          --seed 1
          --red native
          --blue sleep
