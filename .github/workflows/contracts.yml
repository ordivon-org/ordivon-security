name: adversarial research checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  active-research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m compileall -q ordivon_security_experiments ordivon_security_evaluations scripts tests
      - run: python3 -m unittest discover -v
