[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-security"
version = "0.6.0"
description = "Authorized multi-actor adversarial contest and cyber-range research core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ordivon" }]
dependencies = []

[project.optional-dependencies]
cage = [
  "gym==0.26.2",
  "gymnasium==0.28.1",
  "networkx==3.2.1",
  "numpy==1.26.4",
  "pettingzoo==1.24.3",
  "prettytable==3.9.0",
  "pygame==2.5.2",
  "PyYAML==6.0.1",
  "rich==15.0.0",
  "typing_extensions==4.9.0",
]

[project.scripts]
ordivon-security-micro = "ordivon_security.cli:main"
ordivon-security-cage4 = "ordivon_security.cli_cage4:main"
ordivon-security-evaluation-dry-run = "ordivon_security.cli_evaluation:main"
ordivon-security-static-evaluation = "ordivon_security.cli_static_evaluation:main"
ordivon-security-harden-quarantine = "ordivon_security.cli_quarantine:main"
ordivon-security-audit-quarantine = "ordivon_security.cli_quarantine_audit:main"
ordivon-security-case-snapshot = "ordivon_security.cli_case_snapshot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.uv]
package = true
