[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-security"
version = "0.8.0"
description = "Authorized multi-actor adversarial contest and cyber-range research core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ordivon" }]
dependencies = []

[project.optional-dependencies]
cage = [
  "gym==0.26.2",
  "gymnasium==0.28.1",
  "networkx==3.2.1",
  "numpy==1.26.4",
  "pettingzoo==1.24.3",
  "prettytable==3.9.0",
  "pygame==2.5.2",
  "PyYAML==6.0.1",
  "rich==15.0.0",
  "typing_extensions==4.9.0",
]

[project.scripts]
ordivon-security-micro = "ordivon_security.cli:main"
ordivon-security-cage4 = "ordivon_security.cli_cage4:main"
ordivon-security-cage4-deepseek = "ordivon_security.cli_cage4_deepseek:main"
ordivon-security-evaluation-dry-run = "ordivon_security.cli_evaluation:main"
ordivon-security-static-evaluation = "ordivon_security.cli_static_evaluation:main"
ordivon-security-harden-quarantine = "ordivon_security.cli_quarantine:main"
ordivon-security-audit-quarantine = "ordivon_security.cli_quarantine_audit:main"
ordivon-security-case-snapshot = "ordivon_security.cli_case_snapshot:main"
ordivon-security-world-resource = "ordivon_security.cli_world_resource:main"
ordivon-security-world-message = "ordivon_security.cli_world_message:main"
ordivon-security-windows-kvm-build = "ordivon_security.cli_windows_kvm_build:main"
ordivon-security-windows-kvm-acceptance = "ordivon_security.cli_windows_kvm_acceptance:main"
ordivon-security-windows-kvm-s3-acceptance = "ordivon_security.cli_windows_kvm_s3_acceptance:main"
ordivon-security-windows-kvm-s4-acceptance = "ordivon_security.cli_windows_kvm_s4_acceptance:main"
ordivon-security-windows-kvm-s5-acceptance = "ordivon_security.cli_windows_kvm_s5_acceptance:main"
ordivon-security-windows-kvm-s6-acceptance = "ordivon_security.cli_windows_kvm_s6_acceptance:main"
ordivon-security-windows-kvm-c1-acceptance = "ordivon_security.cli_windows_kvm_c1_acceptance:main"
ordivon-security-windows-kvm-c1a-acceptance = "ordivon_security.cli_windows_kvm_c1a_acceptance:main"
ordivon-security-windows-kvm-reconcile = "ordivon_security.cli_windows_kvm_reconcile:main"
ordivon-security-windows-kvm-range-reconcile = "ordivon_security.cli_windows_kvm_range_reconcile:main"
ordivon-security-windows-kvm-p1-prepare = "ordivon_security.cli_windows_kvm_p1_prepare:main"
ordivon-security-windows-kvm-p1-readback = "ordivon_security.cli_windows_kvm_p1_readback:main"
ordivon-security-windows-kvm-p1-reconcile = "ordivon_security.cli_windows_kvm_p1_reconcile:main"
ordivon-security-windows-kvm-p1-materialize-case = "ordivon_security.cli_windows_kvm_p1_materialize_case:main"
ordivon-security-windows-kvm-p1-materialize-execution-media = "ordivon_security.cli_windows_kvm_p1_materialize_execution_media:main"
ordivon-security-windows-kvm-p1-controller-canary = "ordivon_security.cli_windows_kvm_p1_controller_canary:main"
ordivon-security-windows-host-p1-baseline = "ordivon_security.cli_windows_host_p1_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordivon_security = ["resources/windows_kvm/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.uv]
package = true
