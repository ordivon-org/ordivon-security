[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-security"
version = "0.1.0"
description = "Authorized multi-actor adversarial contest research core"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ordivon" }]
dependencies = []

[project.scripts]
ordivon-security-micro = "ordivon_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.uv]
package = true
